name: Ingesta y modelo de sentimiento

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ingest-etl
  cancel-in-progress: false

jobs:
  train-e-ingest:
    name: Entrenar ML + ETL a Supabase
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Entrenar modelo de sentimiento (TF-IDF + LogisticRegression)
        run: python scripts/train_sentiment.py

      - name: Ingesta ETL a Supabase (OHLCV + ARIMA + noticias)
        run: python scripts/ingest.py
        timeout-minutes: 30

      - name: Verificar datos en Supabase
        run: |
          python - <<'PY'
          from datetime import date, timedelta

          from app import db

          errores = []
          limite = date.today() - timedelta(days=4)
          for ticker in ["NVDA", "AAPL", "MSFT"]:
              fila = f"{ticker}: velas=0 noticias=0 forecast=none frescura=?"
              try:
                  with db.connect() as conn:
                      max_date = conn.execute(
                          "SELECT MAX(date) FROM ohlcv WHERE ticker = %s",
                          (ticker,),
                      ).fetchone()
                      velas = conn.execute(
                          "SELECT COUNT(*) FROM ohlcv WHERE ticker = %s",
                          (ticker,),
                      ).fetchone()
                  news = db.read_news(ticker, 3)
                  snap = db.read_latest_forecast(ticker)
                  ultima = str(max_date["max"]) if max_date and max_date["max"] else "sin_data"
                  fresca = bool(max_date and max_date["max"] and max_date["max"] >= limite)
                  if not fresca:
                      errores.append((ticker, f"OHLCV sin actualizar (ultima={ultima})"))
                  fila = (f"{ticker}: velas={velas['count'] if velas else 0} "
                          f"noticias={len(news)} forecast={'ok' if snap else 'none'} "
                          f"ultima={ultima} fresca={'SI' if fresca else 'NO'}")
              except Exception as exc:
                  errores.append((ticker, repr(exc)))
              print(fila)

          if errores:
              for ticker, detalle in errores:
                  print(f"ERROR {ticker}: {detalle}", flush=True)
              raise SystemExit(f"Verificacion fallida: {len(errores)}/3 tickers sin datos frescos")
          PY

  smoke:
    name: Smoke test contra el despliegue
    needs: train-e-ingest
    runs-on: ubuntu-latest
    if: always()
    continue-on-error: true
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_HOST: ${{ vars.VERCEL_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Smoke test de la API desplegada y la base de datos
        run: |
          BASE="${VERCEL_HOST:-https://swing-trading-consultor-ia.vercel.app}"
          python scripts/smoke_remote.py --base "$BASE"
        timeout-minutes: 10