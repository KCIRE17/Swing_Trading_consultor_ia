services:
  swing-ia:
    build:
      context: .
      dockerfile: Dockerfile
    image: swing-trading-consultor-ia:local
    container_name: swing-ia
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # main.py solo monta public/ cuando VERCEL NO esta definido, asi que
      # deliberadamente no se define VERCEL aqui.
      PORT: "8000"
      # Credenciales: copiar .env.example a .env y rellenarlo. El compose lo
      # lee automaticamente. Sin ellas la app funciona en modo fallback
      # (yfinance en vivo, sin persistencia ni narrativa de Gemini).
      DATABASE_URL: ${DATABASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_NARRATIVE_MODEL: ${GEMINI_NARRATIVE_MODEL:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=4).status==200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
