[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swing-trading-consultor-ia"
version = "0.1.0"
description = "Sistema de Soporte a la Toma de Decisiones para Swing Trading (MVP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "yfinance>=1.7.0,<2",
    "pandas",
    "numpy",
    "statsmodels",
    "google-genai",
    "psycopg[binary]",
    "scikit-learn",
    # modelo de sentimiento en disco
    "joblib>=1.4",
    # carga de .env (main.py) y cliente HTTP de los smoke tests
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*"]